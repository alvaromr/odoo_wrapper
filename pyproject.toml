[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-wrapper"
dynamic = ["version"]
description = "Odoo attendance CLI and local weekly-hours dashboard"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
odoo = "odoo_wrapper.cli:main"
odoo-dashboard = "odoo_wrapper.dashboard:main"

[tool.setuptools.dynamic]
version = { attr = "odoo_wrapper.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
odoo_wrapper = ["templates/*", "templates/js/*"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG", "PERF", "PL", "TID", "ERA", "C4", "DTZ", "LOG", "TC", "S"]
# Every subprocess runs a fixed program with a list of arguments and no shell, and the system's own tools
# (launchctl, systemctl, reg, scutil, openssl) are found on the PATH the system gives the session.
ignore = ["S603", "S606", "S607"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# A test helper takes one argument per thing a test may vary (PLR0913) and a test states the values it expects
# (PLR2004); the stand-ins keep the signatures of what they replace (ARG), fixtures are wall-clock times in the
# machine's zone as the user's are (DTZ), bind where the dashboard does (S104) and stop loops with sentinel
# exceptions (N818).
"tests/*" = ["PLR0913", "PLR2004", "ARG", "DTZ", "S104", "N818"]
# Odoo's errors read as what Odoo answered, as Odoo's own AccessDenied does, rather than as errors.
"src/odoo_wrapper/client.py" = ["N818"]
# Requests go to fixed https APIs (Discord, GitHub, Google) and to the Odoo the user signed in to.
"src/odoo_wrapper/{client,discord,sheets,updates}.py" = ["S310"]

[tool.mypy]
files = ["src/odoo_wrapper"]
check_untyped_defs = true

[tool.mutmut]
paths_to_mutate = ["src/odoo_wrapper/"]
tests_dir = ["tests/"]
pytest_add_cli_args = ["-q", "-p", "no:cacheprovider"]
