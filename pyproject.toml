[build-system]
# Exact, so every build of a commit is the same; 77 or later reads the license as an SPDX expression. It builds the
# package on the user's machine, with the user's Python, so it is the last release that runs on requires-python's.
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-wrapper"
dynamic = ["version"]
description = "Odoo attendance CLI and local weekly-hours dashboard"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
odoo = "odoo_wrapper.cli:main"
odoo-dashboard = "odoo_wrapper.dashboard:main"

[tool.setuptools.dynamic]
version = { attr = "odoo_wrapper.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
odoo_wrapper = ["static/*", "static/js/*"]

[tool.ruff]
line-length = 120
# The launchers and the commit-msg hook are Python without a .py, which Ruff finds only when named.
extend-include = ["bin/*", ".githooks/commit-msg"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG", "PERF", "PL", "TID", "ERA", "C4", "DTZ", "LOG", "TC", "S", "D",
]
# S603, S606, S607: every subprocess runs a fixed program with a list of arguments and no shell, and the system's
# own tools (launchctl, systemctl, reg, scutil, openssl) are found on the PATH the system gives the session.
# D105, D107: a class's docstring says what it is built from, and a dunder does what Python says it does.
# TC001-TC003: an import used only in annotations stays a plain import, since a TYPE_CHECKING block never runs and
# the coverage gate counts every line, with no exclusions.
ignore = ["S603", "S606", "S607", "D105", "D107", "TC001", "TC002", "TC003"]

[tool.ruff.lint.isort]
# Annotations stay unevaluated, so the package's types read as on 3.10+ (X | None) while it runs on 3.9.
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Docstrings document the package's code: a test says what it checks in its name (D), and a launcher, a script or a
# hook in its header.
# A test helper takes one argument per thing a test may vary (PLR0913) and a test states the values it expects
# (PLR2004); the stand-ins keep the signatures of what they replace (ARG), fixtures are wall-clock times in the
# machine's zone as the user's are (DTZ), bind where the dashboard does (S104) and stop loops with sentinel
# exceptions (N818). Tests, launchers, scripts and hooks carry no annotations, so they need no future import (I002).
"tests/*" = ["D", "PLR0913", "PLR2004", "ARG", "DTZ", "S104", "N818", "I002"]
"{bin,scripts,.githooks}/*" = ["D", "I002"]
# Odoo's errors read as what Odoo answered, as Odoo's own AccessDenied does, rather than as errors.
"src/odoo_wrapper/client.py" = ["N818"]
# Requests go to fixed https APIs (Discord, GitHub, Google) and to the Odoo the user signed in to.
"src/odoo_wrapper/{client,discord,sheets,updates}.py" = ["S310"]

[tool.mypy]
files = ["src/odoo_wrapper"]
strict = true

[tool.mutmut]
source_paths = ["src/odoo_wrapper/"]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = ["-q", "-p", "no:cacheprovider"]
type_check_command = ["mypy", "src/odoo_wrapper", "--output", "json", "--no-warn-unused-ignores"]
