[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-wrapper"
dynamic = ["version"]
description = "Odoo attendance CLI and local weekly-hours dashboard"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
odoo = "odoo_wrapper.cli:main"
odoo-dashboard = "odoo_wrapper.dashboard:main"

[tool.setuptools.dynamic]
version = { attr = "odoo_wrapper.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
odoo_wrapper = ["templates/*", "templates/js/*"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "TID", "PLW1510", "PLR09"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# A test helper takes one argument per thing a test may vary, defaulted, as a request's host, cookie and body.
"tests/*" = ["PLR0913"]

[tool.mypy]
files = ["src/odoo_wrapper"]
check_untyped_defs = true

[tool.mutmut]
paths_to_mutate = ["src/odoo_wrapper/"]
tests_dir = ["tests/"]
pytest_add_cli_args = ["-q", "-p", "no:cacheprovider"]
