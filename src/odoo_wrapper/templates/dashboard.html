<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fichajes · Horas semanales</title>
<link rel="stylesheet" href="/style.css">
<script src="/js/theme.js"></script>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#171717">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fichajes">
<link rel="stylesheet" href="/dashboard.css">
</head>
<body>
<div id="loadbar" role="progressbar" aria-label="Cargando"></div>
<div class="page">
  <header>
    <h1 id="title"></h1>
    <span class="sub" id="subtitle"></span>
    <a class="hdr-btn hidden" id="teamLink" href="/gestion">Gestión</a>
    <button class="hdr-btn hidden" id="requestBtn" type="button"
            title="Abre en Odoo una solicitud de cambio de fichaje nueva">Nueva solicitud</button>
    <button class="hdr-btn" id="refreshBtn" type="button">Actualizar</button>
    <button class="hdr-btn" id="logoutBtn" type="button">Cerrar sesión</button>
  </header>
  <div class="update hidden" id="updateBanner" role="status"></div>

  <div id="loadmsg">Cargando datos de Odoo…</div>

  <div id="app" class="hidden">
    <section class="card hero" id="hero"></section>
    <section class="card errors hidden" id="errorsBanner"></section>

    <h2 class="weeks-title">Calendario semanal</h2>
    <section class="card" id="weekCal"></section>
    <p class="weeks-hint" id="weeksHint"></p>

    <div class="filter-row">
      <span class="filter-label">Mostrar</span>
      <div class="seg" id="rangeSeg" role="group" aria-label="Rango de semanas">
        <button type="button" data-months="1">1 mes</button>
        <button type="button" data-months="6" aria-pressed="true">6 meses</button>
        <button type="button" data-months="12">1 año</button>
        <button type="button" data-months="all">Todo</button>
      </div>
      <span class="spacer"></span>
      <div class="seg" id="viewSeg" role="group" aria-label="Tipo de vista">
        <button type="button" data-view="charts" aria-pressed="true">Gráficas</button>
        <button type="button" data-view="table">Tabla</button>
      </div>
    </div>

    <div id="chartsView">
      <section class="kpis" id="kpis"></section>

      <section class="card overview">
        <h2 id="overviewTitle"></h2>
        <div class="caption" id="overviewCaption"></div>
        <div id="overviewChart"></div>
      </section>
    </div>

    <section class="card tablewrap hidden" id="tableView"></section>

    <section class="card phone hidden" id="phone"></section>
  </div>
</div>
<div id="tip" role="tooltip"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
