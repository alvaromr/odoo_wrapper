# Installs only what pnpm-lock.yaml holds, and only releases four days old or more, from publishers no less
# trusted than before; no dependency runs a build script.
minimumReleaseAge: 5760
trustPolicy: no-downgrade
verifyDepsBeforeRun: error
allowBuilds: {}
# StrykerJS 10.1.1 pins releases with known denial-of-service advisories (scripts/audit.py reports them); these are
# the first fixed ones. minimatch 11 drops only what StrykerJS does not call (makeRe, the AST, debug). Remove each
# once StrykerJS requires a fixed release itself.
overrides:
  qs: ^6.16.1
  minimatch: ^11.0.1
